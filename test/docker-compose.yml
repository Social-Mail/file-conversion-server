# docker-compose.yml
version: "3"
services:
  app:
    # restart: on-failure
    container_name: social-mail-test-file-conversion-server
    image: social-mail-test-file-conversion-server
    build:
      context: ../
      dockerfile: Dockerfile
    environment:
      - PORT=80
      - DEBUG=true
    ports:
      - "9991:80"
      - "9229:9229"
    entrypoint: ["/sbin/tini", "--", "npm", "run", "dev"]
